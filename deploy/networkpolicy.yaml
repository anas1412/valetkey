# Optional. Anyone in the cluster may call the proxy port; the admin port (dashboard,
# admin API, metrics) only accepts traffic from namespaces labelled
#   llmproxy.llmproxy.io/admin-access: "true"
# (label your monitoring namespace for Prometheus). kubectl port-forward is not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmproxy
  namespace: llmproxy-system
spec:
  podSelector:
    matchLabels: { app: llmproxy }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8000 }
    - ports:
        - { port: 8081 }
      from:
        - namespaceSelector:
            matchLabels:
              llmproxy.llmproxy.io/admin-access: "true"
