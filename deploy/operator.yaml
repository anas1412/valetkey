apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmproxy-operator
  namespace: llmproxy-system
---
# Cluster-wide: tenants' ProxyKeys and the Secrets minted next to them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llmproxy-operator
rules:
  - apiGroups: [llmproxy.llmproxy.io]
    resources: [proxykeys]
    verbs: [get, list, watch, create, update, delete]   # create/update/delete: admin API + dashboard
  - apiGroups: [llmproxy.llmproxy.io]
    resources: [proxykeys/status]
    verbs: [get, patch, update]
  # Tenant Secret names are generated (<proxykey>-llmproxy), so resourceNames can't narrow this.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [list]                                         # tenant picker in the dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llmproxy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llmproxy-operator
subjects:
  - kind: ServiceAccount
    name: llmproxy-operator
    namespace: llmproxy-system
---
# Operator namespace only: Channels, Groups and provider API key Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmproxy-operator
  namespace: llmproxy-system
rules:
  - apiGroups: [llmproxy.llmproxy.io]
    resources: [channels, groups]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [llmproxy.llmproxy.io]
    resources: [channels/status, groups/status]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmproxy-operator
  namespace: llmproxy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmproxy-operator
subjects:
  - kind: ServiceAccount
    name: llmproxy-operator
    namespace: llmproxy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmproxy
  namespace: llmproxy-system
spec:
  # Keep at 1: the reconciler has no leader election, and rate limits / dashboard stats are in-memory.
  replicas: 1
  selector:
    matchLabels: { app: llmproxy }
  template:
    metadata:
      labels: { app: llmproxy }
    spec:
      serviceAccountName: llmproxy-operator
      terminationGracePeriodSeconds: 60   # lets in-flight streams finish on shutdown
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: llmproxy
          image: ghcr.io/anas1412/llmproxy-k8s:2.0.0
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: PROXY_URL
              value: http://llmproxy.llmproxy-system.svc.cluster.local:8000
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: llmproxy-admin
                  key: adminKey
                  optional: true   # without it the admin API and dashboard stay disabled
          ports:
            - { containerPort: 8000, name: proxy }
            - { containerPort: 8081, name: admin }
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# Tenant-facing: only the proxy port.
apiVersion: v1
kind: Service
metadata:
  name: llmproxy
  namespace: llmproxy-system
spec:
  selector: { app: llmproxy }
  ports:
    - { name: proxy, port: 8000, targetPort: proxy }
---
# Internal: dashboard, admin API, health and Prometheus metrics.
apiVersion: v1
kind: Service
metadata:
  name: llmproxy-admin
  namespace: llmproxy-system
spec:
  selector: { app: llmproxy }
  ports:
    - { name: admin, port: 8081, targetPort: admin }
