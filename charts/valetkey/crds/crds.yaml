apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providers.valetkey.dev
spec:
  group: valetkey.dev
  scope: Namespaced
  names:
    kind: Provider
    plural: providers
    singular: provider
    shortNames: [prov]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: BaseURL
          type: string
          jsonPath: .spec.baseURL
        - name: Status
          type: string
          jsonPath: .spec.status
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [baseURL, type, keySecretRef]
              properties:
                baseURL:
                  type: string
                  pattern: '^https?://'
                type:
                  type: string
                  enum: [openai, anthropic]
                keySecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: apiKey
                priority:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  default: 10
                status:
                  type: string
                  enum: [Enabled, Disabled]
                  default: Enabled
                models:
                  type: array
                  items:
                    type: string
                proxyURL:
                  type: string
                  description: "Outbound HTTP proxy for this provider, e.g. http://proxy:3128"
                skipTLSVerify:
                  type: boolean
                  description: "Skip upstream TLS certificate verification (self-signed endpoints only)"
                modelMapping:
                  type: object
                  description: "Rewrites the requested model before forwarding, e.g. gpt-4o -> my-azure-deployment"
                  additionalProperties:
                    type: string
                pricing:
                  type: object
                  description: "How requests to this provider are priced. Without it, prices come from the live catalogue entry guessed from baseURL."
                  properties:
                    provider:
                      type: string
                      description: "Catalogue provider id (models.dev), e.g. deepseek, openai, anthropic, groq"
                    models:
                      type: object
                      description: "Per-model prices in dollars per million tokens; they win over the catalogue"
                      additionalProperties:
                        type: object
                        required: [input, output]
                        properties:
                          input: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                          output: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                          cacheRead: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                          cacheWrite: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                          cacheWrite1h: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', 'Unknown']
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                ready:
                  type: boolean
                message:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: proxykeys.valetkey.dev
spec:
  group: valetkey.dev
  scope: Namespaced
  names:
    kind: ProxyKey
    plural: proxykeys
    singular: proxykey
    shortNames: [pkey]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .spec.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Secret
          type: string
          jsonPath: .status.secretName
        - name: Spent
          type: string
          jsonPath: .status.spend.usd
        - name: Budget
          type: string
          jsonPath: .spec.budget.usd
        - name: Expires
          type: string
          jsonPath: .spec.expiresAt
          priority: 1
        - name: Message
          type: string
          jsonPath: .status.message
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                status:
                  type: string
                  enum: [Enabled, Disabled]
                  default: Enabled
                models:
                  type: array
                  items:
                    type: string
                subnets:
                  type: array
                  description: "Allowed client IP ranges (IPv4 or IPv6 CIDR). Empty = any IP."
                  items:
                    type: string
                rpm:
                  type: integer
                  minimum: 0
                  description: "Requests per minute for this key, multiplied by the tenant's rpmRatio. 0 = unlimited."
                tpm:
                  type: integer
                  minimum: 0
                  description: "Tokens per minute for this key, multiplied by the tenant's tpmRatio. 0 = unlimited."
                budget:
                  type: object
                  description: "Dollar budget per period. Requests that might go over it get 429 insufficient_quota."
                  required: [usd]
                  properties:
                    usd:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?$'
                      description: "Budget in US dollars per period, e.g. \"20\" or \"0.50\""
                    period:
                      type: string
                      enum: [daily, weekly, monthly]
                      default: monthly
                    timezone:
                      type: string
                      description: "IANA time zone where periods start (midnight, Monday, the 1st). Default UTC."
                modelBudgets:
                  type: object
                  description: "Dollar budgets for single models on this key, e.g. claude-opus-4-5: {usd: \"5\", period: daily}"
                  additionalProperties:
                    type: object
                    required: [usd]
                    properties:
                      usd:
                        type: string
                        pattern: '^[0-9]+(\.[0-9]+)?$'
                      period:
                        type: string
                        enum: [daily, weekly, monthly]
                        default: monthly
                      timezone:
                        type: string
                maxTokens:
                  type: integer
                  minimum: 1
                  description: "Output cap added to requests that don't set max_tokens. Keeps budget reservations small."
                expiresAt:
                  type: string
                  format: date-time
                  description: "When the key stops working (RFC 3339), e.g. 2026-12-31T23:59:59Z"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', 'Unknown']
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                ready:
                  type: boolean
                message:
                  type: string
                keyHash:
                  type: string
                secretName:
                  type: string
                rotation:
                  type: string
                  description: "The valetkey.dev/rotate annotation value the current key was issued for."
                spend:
                  type: object
                  description: "Spend in the current budget period, written by Valetkey. usd is the total of all replicas."
                  properties:
                    periodStart:
                      type: string
                    usd:
                      type: string
                    requests:
                      type: integer
                    unpriced:
                      type: integer
                    updatedAt:
                      type: string
                    pods:
                      type: object
                      description: "Each replica's share of this period's spend"
                      additionalProperties:
                        type: object
                        nullable: true
                        properties:
                          periodStart:
                            type: string
                          usd:
                            type: string
                          requests:
                            type: integer
                          unpriced:
                            type: integer
                modelSpend:
                  type: object
                  description: "Spend per model with a budget in spec.modelBudgets"
                  additionalProperties:
                      type: object
                      properties:
                        periodStart:
                          type: string
                        usd:
                          type: string
                        requests:
                          type: integer
                        unpriced:
                          type: integer
                        updatedAt:
                          type: string
                        pods:
                          type: object
                          description: "Each replica's share of this period's spend"
                          additionalProperties:
                            type: object
                            nullable: true
                            properties:
                              periodStart:
                                type: string
                              usd:
                                type: string
                              requests:
                                type: integer
                              unpriced:
                                type: integer
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.valetkey.dev
spec:
  group: valetkey.dev
  scope: Namespaced
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    shortNames: [tn]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .spec.status
        - name: Providers
          type: string
          jsonPath: .spec.providers
        - name: RPM
          type: string
          jsonPath: .spec.rpmRatio
        - name: TPM
          type: string
          jsonPath: .spec.tpmRatio
        - name: Spent
          type: string
          jsonPath: .status.spend.usd
        - name: Budget
          type: string
          jsonPath: .spec.budget.usd
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [providers]
              properties:
                status:
                  type: string
                  enum: [Enabled, Disabled]
                  default: Enabled
                providers:
                  type: array
                  items:
                    type: string
                rpmRatio:
                  type: number
                  minimum: 0
                  default: 1.0
                tpmRatio:
                  type: number
                  minimum: 0
                  default: 1.0
                budget:
                  type: object
                  description: "Dollar budget per period for all of the tenant's keys together. Requests that might go over it get 429 insufficient_quota."
                  required: [usd]
                  properties:
                    usd:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?$'
                      description: "Budget in US dollars per period, e.g. \"20\" or \"0.50\""
                    period:
                      type: string
                      enum: [daily, weekly, monthly]
                      default: monthly
                    timezone:
                      type: string
                      description: "IANA time zone where periods start (midnight, Monday, the 1st). Default UTC."
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', 'Unknown']
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                ready:
                  type: boolean
                message:
                  type: string
                spend:
                  type: object
                  description: "Spend in the current budget period, written by Valetkey. usd is the total of all replicas."
                  properties:
                    periodStart:
                      type: string
                    usd:
                      type: string
                    requests:
                      type: integer
                    unpriced:
                      type: integer
                    updatedAt:
                      type: string
                    pods:
                      type: object
                      description: "Each replica's share of this period's spend"
                      additionalProperties:
                        type: object
                        nullable: true
                        properties:
                          periodStart:
                            type: string
                          usd:
                            type: string
                          requests:
                            type: integer
                          unpriced:
                            type: integer
