image:
  repository: ghcr.io/anas1412/valetkey
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Pods serving requests. With 2 or more, one of them (picked with a Lease) mints keys
# and writes status, budgets are shared through CRD status, and a PodDisruptionBudget
# keeps one running during node drains. Rate limits stay per pod.
replicas: 1

# URL written into tenant key Secrets and shown in the dashboard's examples.
# Defaults to http://<release>.<namespace>.svc.cluster.local:8000
proxyURL: ""

# Prometheus that scrapes Valetkey. When set, the dashboard's Overview and key usage come
# from Prometheus (24 h, 7 d, 30 d) and survive pod restarts. Leave empty to use the
# pod's own memory. Example: http://prometheus-operated.monitoring.svc:9090
prometheus:
  url: ""

# Live prices for dollar budgets and cost tracking. Valetkey fetches them from
# models.dev, openrouter.ai, api-docs.deepseek.com and raw.githubusercontent.com
# (Chinese holidays). Set refreshInterval to "off" in clusters without internet
# access: the prices built into the image and provider price overrides are used instead.
pricing:
  refreshInterval: 6h

# Number of reverse proxies (ingress, load balancer) in front of Valetkey. With N > 0
# the client IP used for allow lists is read from X-Forwarded-For.
trustProxy: 0

service:
  type: ClusterIP
  proxyPort: 8000
  metricsPort: 8081

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { memory: 256Mi }

# Only allow other namespaces to reach the proxy port; metrics only from namespaces
# carrying the label below (e.g. your monitoring namespace).
networkPolicy:
  enabled: false
  metricsNamespaceLabel:
    valetkey.dev/metrics: "true"

# Prometheus Operator ServiceMonitor for /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Prometheus Operator alert rules: budgets almost used or used up, error rate,
# failing providers, stale prices, Valetkey down.
prometheusRule:
  enabled: false
  labels: {}
  # Failed upstream attempts per provider in 10 minutes before alerting.
  providerErrors: 20

# Grafana dashboard as a ConfigMap for Grafana's dashboard sidecar.
grafanaDashboard:
  enabled: false
  # Namespace Grafana watches, if it only watches its own.
  namespace: ""
  labels:
    grafana_dashboard: "1"
  # e.g. grafana_folder: Valetkey
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
