apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
---
# Cluster-wide: tenants' ProxyKeys and the key Secrets minted next to them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
rules:
  - apiGroups: [valetkey.dev]
    resources: [proxykeys]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [valetkey.dev]
    resources: [proxykeys/status]
    verbs: [get, patch, update]
  # Key Secret names are generated (<proxykey>-valetkey), so resourceNames can't narrow this.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [list]
  # Budget alerts on keys (in tenant namespaces) and tenants.
  - apiGroups: ['']
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "valetkey.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "valetkey.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Release namespace only: Channels, Groups and provider key Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
rules:
  - apiGroups: [valetkey.dev]
    resources: [channels, groups]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [valetkey.dev]
    resources: [channels/status, groups/status]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  # Picks the one replica that mints keys and writes status.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "valetkey.fullname" . }}]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  # The last fetched price list, kept so restarts don't depend on the internet.
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [valetkey-pricing]
    verbs: [get, update]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "valetkey.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "valetkey.fullname" . }}
    namespace: {{ .Release.Namespace }}
