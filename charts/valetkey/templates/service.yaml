apiVersion: v1
kind: Service
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "valetkey.selectorLabels" . | nindent 4 }}
  ports:
    - { name: proxy, port: {{ .Values.service.proxyPort }}, targetPort: proxy }
    - { name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: metrics }
