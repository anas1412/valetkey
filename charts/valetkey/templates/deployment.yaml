apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels: {{- include "valetkey.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "valetkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "valetkey.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "valetkey.fullname" . }}
      terminationGracePeriodSeconds: 60   # lets in-flight streams finish on shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                  # distroless "nonroot"
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valetkey
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: PROXY_URL
              value: {{ .Values.proxyURL | default (printf "http://%s.%s.svc.cluster.local:%v" (include "valetkey.fullname" .) .Release.Namespace .Values.service.proxyPort) | quote }}
            - name: LEASE_NAME
              value: {{ include "valetkey.fullname" . | quote }}
            - name: PRICING_REFRESH
              value: {{ .Values.pricing.refreshInterval | quote }}
            {{- with .Values.prometheus.url }}
            - name: PROMETHEUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.trustProxy }}
            - name: TRUST_PROXY
              value: {{ .Values.trustProxy | quote }}
            {{- end }}
          ports:
            - { containerPort: 8000, name: proxy }
            - { containerPort: 8081, name: metrics }
            # The dashboard and admin API listen on 127.0.0.1:8082 inside the pod:
            # reachable only with `kubectl port-forward`, never through a Service.
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
