{{- if .Values.prometheusRule.enabled }}
# Alerts for the Prometheus Operator. With plain Prometheus, copy the rules from
# `helm template --set prometheusRule.enabled=true`.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "valetkey.fullname" . }}
  labels:
    {{- include "valetkey.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: valetkey
      rules:
        - alert: ValetkeyBudgetAlmostUsed
          expr: max by (scope, name) (valetkey_budget_spent_usd / on (scope, name) group_left valetkey_budget_usd) > 0.8
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $labels.scope }} {{ $labels.name }}`}} has used {{`{{ $value | humanizePercentage }}`}} of its budget"
        - alert: ValetkeyBudgetReached
          expr: sum by (group, scope) (increase(valetkey_budget_rejections_total[10m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "Requests of tenant {{`{{ $labels.group }}`}} are refused: a {{`{{ $labels.scope }}`}} budget is used up"
        - alert: ValetkeyHighErrorRate
          expr: |
            sum(rate(valetkey_requests_total{status_code=~"5.."}[5m])) / sum(rate(valetkey_requests_total[5m])) > 0.1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{`{{ $value | humanizePercentage }}`}} of requests through Valetkey fail with a 5xx"
        - alert: ValetkeyProviderFailing
          expr: sum by (channel) (increase(valetkey_channel_errors_total[10m])) > {{ .Values.prometheusRule.providerErrors }}
          labels: { severity: warning }
          annotations:
            summary: "Provider {{`{{ $labels.channel }}`}} failed {{`{{ $value }}`}} times in 10 minutes"
        - alert: ValetkeyPricesStale
          expr: time() - max(valetkey_pricing_fetched_timestamp_seconds) > 86400
          for: 1h
          labels: { severity: info }
          annotations:
            summary: "Valetkey's prices are more than a day old; costs may be off"
        - alert: ValetkeyDown
          expr: absent(up{job="{{ include "valetkey.fullname" . }}"} == 1)
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Prometheus can't reach Valetkey"
{{- end }}
