{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llmp.fullname" . }}
  labels: {{- include "llmp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "llmp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8000 }
    - ports:
        - { port: 8081 }
      from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.metricsNamespaceLabel | nindent 14 }}
{{- end }}
