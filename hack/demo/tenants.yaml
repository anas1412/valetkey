# Three tenants, one key each, and a traffic generator per key that reads the key's Secret.
#   billing:  asks for gpt-4o-mini, and sometimes gpt-4o, which the key may not use (403)
#   support:  Claude and GPT
#   research: more traffic than its 30 rpm limit allows (429)
apiVersion: v1
kind: Namespace
metadata: { name: billing }
---
apiVersion: v1
kind: Namespace
metadata: { name: support }
---
apiVersion: v1
kind: Namespace
metadata: { name: research }
---
apiVersion: valetkey.dev/v1alpha1
kind: Group
metadata: { name: billing, namespace: valetkey-system }
spec: { channelRefs: [openai] }
---
apiVersion: valetkey.dev/v1alpha1
kind: Group
metadata: { name: support, namespace: valetkey-system }
spec: { channelRefs: [openai, anthropic] }
---
apiVersion: valetkey.dev/v1alpha1
kind: Group
metadata: { name: research, namespace: valetkey-system }
spec: { channelRefs: [openai, anthropic] }
---
apiVersion: valetkey.dev/v1alpha1
kind: ProxyKey
metadata: { name: invoice-api, namespace: billing }
spec: { models: [gpt-4o-mini] }
---
apiVersion: valetkey.dev/v1alpha1
kind: ProxyKey
metadata: { name: helpdesk, namespace: support }
spec: { models: [claude-haiku-4-5, claude-sonnet-4-5, gpt-4o-mini] }
---
apiVersion: valetkey.dev/v1alpha1
kind: ProxyKey
metadata: { name: notebooks, namespace: research }
spec: { rpm: 30 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: traffic, namespace: billing }
spec:
  selector: { matchLabels: { app: traffic } }
  template:
    metadata: { labels: { app: traffic } }
    spec:
      containers:
        - name: load
          image: localhost/valetkey-fakeprovider:dev
          imagePullPolicy: Never
          args: [load]
          envFrom: [{ secretRef: { name: invoice-api-valetkey } }]
          env:
            - { name: MODELS, value: "gpt-4o-mini,gpt-4o-mini,gpt-4o-mini,gpt-4o-mini,gpt-4o" }
            - { name: INTERVAL, value: "3" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: traffic, namespace: support }
spec:
  selector: { matchLabels: { app: traffic } }
  template:
    metadata: { labels: { app: traffic } }
    spec:
      containers:
        - name: load
          image: localhost/valetkey-fakeprovider:dev
          imagePullPolicy: Never
          args: [load]
          envFrom: [{ secretRef: { name: helpdesk-valetkey } }]
          env:
            - { name: MODELS, value: "claude-haiku-4-5,claude-sonnet-4-5,gpt-4o-mini" }
            - { name: INTERVAL, value: "2" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: traffic, namespace: research }
spec:
  selector: { matchLabels: { app: traffic } }
  template:
    metadata: { labels: { app: traffic } }
    spec:
      containers:
        - name: load
          image: localhost/valetkey-fakeprovider:dev
          imagePullPolicy: Never
          args: [load]
          envFrom: [{ secretRef: { name: notebooks-valetkey } }]
          env:
            - { name: MODELS, value: "gpt-4o,claude-sonnet-4-5" }
            - { name: INTERVAL, value: "1" }
