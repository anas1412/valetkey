name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      # The binary embeds the dashboard, so build it first.
      - run: npm ci && npm run build
        working-directory: web
      - run: go vet ./...
      - run: go test -race ./...
      - run: helm lint charts/valetkey
      - run: bash -n scripts/valetkeyctl hack/demo.sh hack/e2e.sh

  # The playground on a kind cluster, then requests, budgets, expiry, restarts,
  # two replicas and the alert rules (hack/e2e.sh).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - uses: azure/setup-helm@v4
      - run: hack/demo.sh up
      - run: hack/e2e.sh
      - name: Logs on failure
        if: failure()
        env: { KUBECONFIG: hack/.demo/kubeconfig }
        run: |
          kubectl get pods -A
          kubectl logs -n valetkey-system deploy/valetkey --tail=200 || true

  # On a v* tag: container image, Helm chart (OCI) and a GitHub release.
  release:
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Prices built into the image, for clusters that can't fetch them.
      - name: Refresh the built-in price list
        run: go run ./hack/pricing-snapshot

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - uses: azure/setup-helm@v4
      - name: Push the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/valetkey --version "$VERSION" --app-version "$VERSION"
          helm push "valetkey-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          # Plain manifests for clusters without Helm.
          helm template valetkey charts/valetkey --namespace valetkey-system --include-crds \
            --set image.tag="$VERSION" > valetkey.yaml

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "valetkey-$VERSION.tgz" valetkey.yaml \
            --title "Valetkey $VERSION" --generate-notes \
            --notes "$(printf 'Image: `ghcr.io/%s:%s`\n\nHelm:\n```\nhelm install valetkey oci://ghcr.io/%s/charts/valetkey --version %s -n valetkey-system --create-namespace\n```\n\nWithout Helm: `kubectl apply -f valetkey.yaml` (namespace valetkey-system must exist).' \
              "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_REPOSITORY_OWNER" "$VERSION")"
